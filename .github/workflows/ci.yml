name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # Integration tests start a throwaway PostgreSQL container (Testcontainers) on the runner's
      # Docker; no API keys are needed because nothing calls Gemini at startup.
      - name: Build and test
        run: bash mvnw -B verify
