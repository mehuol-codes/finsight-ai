spring.application.name=finsight-ai

# --- LLM: Google Gemini native API (free key from https://aistudio.google.com) ---
# Set the key as an environment variable, never commit it:  GEMINI_API_KEY=...
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.options.temperature=0.3

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.options.dimensions=1536

# Only chat + text embeddings are used
spring.ai.model.image=none

# --- Vector store (pgvector from compose.yaml) ---
# 1536 matches the existing table and stays under pgvector's 2000-dim index limit
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536

# --- Chat history (schema.sql) and persistent LLM chat memory ---
spring.sql.init.mode=always
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# --- Live gold (XAU/USD) data: free key from https://twelvedata.com ---
twelvedata.api-key=${TWELVE_DATA_API_KEY:}

# --- Uploads ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

logging.level.org.apache.pdfbox=ERROR
    